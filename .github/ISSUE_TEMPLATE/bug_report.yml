name: Relatar problema
description: Informe um comportamento reproduzível do Nexo Pessoas.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Não publique credenciais, CPFs reais, tokens ou outros dados pessoais."
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o resultado observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir?
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options: [Docker local, Desenvolvimento local, Vercel]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências sem dados pessoais
      description: Logs sanitizados, navegador e versão do sistema.
