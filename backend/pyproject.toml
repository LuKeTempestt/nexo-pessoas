[project]
name = "nexo-pessoas-api"
version = "5.1.1"
description = "API FastAPI do Nexo Pessoas"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.0,<1",
  "pydantic-settings>=2.10.0,<3",
  "redis>=6.4.0,<7",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "upstash-redis>=1.4.0,<2",
  "uvicorn[standard]>=0.35.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexo_api"]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0,<2",
  "httpx2>=2.9.0,<3",
  "pytest>=8.4.0,<9",
  "pytest-cov>=6.2.0,<7",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "C901",
  "CPY001",
  "D102",
  "D107",
  "D203",
  "D213",
  "D401",
  "EM101",
  "FBT001",
  "FBT003",
  "FAST001",
  "FAST002",
  "PLR2004",
  "S608",
  "SIM102",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"backend/tests/**/*.py" = ["S101"]
"backend/server.py" = ["INP001"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
include = ["src", "tests"]
exclude = [".venv"]
reportAny = false
reportCallInDefaultInitializer = false
reportImplicitStringConcatenation = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnusedFunction = false

[tool.vercel]
entrypoint = "server:app"
