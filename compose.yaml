services:
  database:
    image: postgres:17-alpine
    container_name: crud-usuarios-db
    environment:
      POSTGRES_DB: crud_usuarios
      POSTGRES_USER: crud_app
      POSTGRES_PASSWORD: crud_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_criar_tabela.sql:/docker-entrypoint-initdb.d/01_criar_tabela.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crud_app -d crud_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
