# Nome legado mantido para reutilizar o volume local sem aparentar perda de dados.
name: crud-usuarios

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-crud_usuarios}
      POSTGRES_USER: ${DB_USER:-crud_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crud_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crud_app} -d ${DB_NAME:-crud_usuarios}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [data]

  migrate:
    image: postgres:18-alpine
    environment:
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-crud_usuarios}
      PGUSER: ${DB_USER:-crud_app}
      PGPASSWORD: ${DB_PASSWORD:-crud_dev_password}
    volumes:
      - ./database:/migrations:ro
    command:
      - /bin/sh
      - -c
      - >-
        for file in
        /migrations/01_criar_tabela.sql
        /migrations/02_adicionar_exclusao_logica.sql
        /migrations/03_adicionar_status_usuario.sql
        /migrations/04_adicionar_seguranca_e_auditoria.sql;
        do echo "Aplicando $${file}" && psql --set ON_ERROR_STOP=1 --file "$${file}";
        done
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks: [data]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-crud_app}:${DB_PASSWORD:-crud_dev_password}@database:5432/${DB_NAME:-crud_usuarios}
      REDIS_URL: redis://redis:6379
      SESSION_COOKIE_SECURE: "false"
      SETUP_MODE: local
      TRUSTED_HOST: localhost,127.0.0.1,host.docker.internal
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saude/prontidao', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [web, data]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [web]

networks:
  web:
  data:
    internal: true

volumes:
  postgres_data:
